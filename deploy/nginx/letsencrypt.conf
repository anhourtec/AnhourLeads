# Self-hosted HTTPS with Let's Encrypt (APP_TLS_PROVIDER=nginx, NGINX_CONF=letsencrypt,
# COMPOSE_PROFILES=letsencrypt). See docs/domains-and-ssl.md. Mounted as /etc/nginx/conf.d/anhourleads.conf.
#
# - Port 80, every host: ACME HTTP-01 challenges from the shared webroot, everything else → HTTPS.
# - Port 443: one server block per hostname that has a certificate, generated into /etc/nginx/sites/
#   (deploy/nginx/sites/, gitignored) by the certbot container (deploy/certbot/sync-certs.sh): the
#   primary hosts and serving workspace hostnames.
# - Any other name on 443 has its TLS handshake refused (no certificate is ever shown for it).
# - Works with or without Cloudflare's proxy in front: the client address is restored only for
#   requests from Cloudflare's published ranges, and ACME challenges are also answered on 443.

include /etc/nginx/snippets/cloudflare-real-ip.conf;

server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/health {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

include /etc/nginx/sites/*.conf;
