# Main NGINX configuration for the production stack (deploy/docker-compose.prod.yml).
# See docs/domains-and-ssl.md. Mounted at /etc/nginx/nginx.conf in the nginx (and certbot) containers.
#
# The mode-specific servers live in conf.d/anhourleads.conf, which compose mounts from
# deploy/nginx/${NGINX_CONF}.conf: letsencrypt.conf (self-hosted certificates with certbot, default)
# or cloudflare.conf (behind Cloudflare).

worker_processes auto;
# Shared with the certbot container (volume on /run) so `nginx -s reload` works from there.
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # Docker's embedded DNS: the app is resolved per request (snippets/proxy-pass.conf), so NGINX
    # starts even while the app is being recreated and follows its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # CSV imports are the largest request bodies.
    client_max_body_size 25m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/csv application/json application/javascript application/xml
               image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    include /etc/nginx/snippets/logging.conf;
    include /etc/nginx/conf.d/anhourleads.conf;
}
