# The proxy_pass itself (location context); see proxy.conf.

# Resolved per request through Docker's DNS (resolver in nginx.conf), so NGINX starts and keeps
# working while the app container is recreated.
set $anhourleads_app http://app:3410;
proxy_pass $anhourleads_app;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# One id per request, generated here (never taken from the client), shared with the app's logs.
proxy_set_header X-Request-Id $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Pages carry large Link headers (preloads) plus cookies: more than NGINX's default header buffer.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# Crawls and exports can take a while to answer.
proxy_read_timeout 120s;

# Return the same id to the client (replacing any the app might set).
proxy_hide_header X-Request-Id;
add_header X-Request-Id $request_id always;
