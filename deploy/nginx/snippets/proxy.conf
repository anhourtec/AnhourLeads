# Proxy to the app (server context). Included by every HTTPS server in cloudflare.conf,
# letsencrypt.conf and the generated sites/*.conf.
#
# The app resolves the workspace from the Host itself, so every Host is passed through as-is.
# X-Forwarded-For / -Proto / -Host are OVERWRITTEN (never appended), so whatever a client sends is
# discarded; that is what makes APP_TRUST_PROXY=true safe for the app.

# Liveness / readiness probes: never logged.
location ^~ /api/health {
    access_log off;
    include /etc/nginx/snippets/proxy-pass.conf;
}

location / {
    include /etc/nginx/snippets/proxy-pass.conf;
}
