# JSON access log (http context), one object per line on stdout; errors go to stderr (nginx.conf).
# Fields are described in docs/domains-and-ssl.md ("Logs and request IDs").
#
# - remote_addr is the real client address (restored from CF-Connecting-IP for Cloudflare's ranges).
# - uri is the path only, never the query string (auth links carry tokens there); args_present says
#   whether there was one. Paths that carry a token themselves (invitations, password resets,
#   unsubscribe links) are logged with the token replaced by [redacted]; the referer likewise.
# - request_id is generated here for every request, sent to the app as X-Request-Id and returned in
#   the X-Request-Id response header, so a reported id matches this line and the app's log lines.

map $uri $log_uri {
    "~^(?<lu_pre>.*/(accept-invite|reset-password|unsubscribe)/)[^/]+(?<lu_rest>.*)$" "${lu_pre}[redacted]${lu_rest}";
    default $uri;
}

map $http_referer $log_referer {
    "~^(?<lr_pre>[^?#]*/(accept-invite|reset-password|unsubscribe)/)[^/?#]+" "${lr_pre}[redacted]";
    "~^(?<lr_path>[^?#]*)" $lr_path;
    default "";
}

map $args $args_present {
    "" false;
    default true;
}

log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$log_uri",'
        '"args_present":$args_present,'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$log_referer",'
        '"ssl_protocol":"$ssl_protocol",'
        '"server_name":"$server_name"'
    '}';

access_log /dev/stdout json_combined;
