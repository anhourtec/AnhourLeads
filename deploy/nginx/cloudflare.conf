# Origin behind Cloudflare (APP_TLS_PROVIDER=cloudflare, NGINX_CONF=cloudflare).
# See docs/domains-and-ssl.md. Mounted as /etc/nginx/conf.d/anhourleads.conf (http context).
#
# Cloudflare terminates HTTPS for every hostname (the installation's own and workspaces' custom
# hostnames via Cloudflare for SaaS) and connects here with SSL mode Full (strict). This origin
# serves a Cloudflare Origin CA certificate for every hostname and proxies ANY Host to the app:
# the app decides which workspace (or "not found") a hostname is.
#
# Firewall: allow 80/443 only from Cloudflare's ranges (https://www.cloudflare.com/ips/), or turn on
# Authenticated Origin Pulls below; otherwise anyone could reach the origin directly.

include /etc/nginx/snippets/cloudflare-real-ip.conf;

server {
    listen 80 default_server;
    server_name _;

    location ^~ /api/health {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Origin CA certificate + key (SSL/TLS → Origin Server → Create certificate), saved on the server
    # as deploy/certs/origin.pem and deploy/certs/origin-key.pem. Never commit them.
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;

    # Optional: Authenticated Origin Pulls (mTLS). Save Cloudflare's origin-pull CA as
    # deploy/certs/cloudflare-origin-pull-ca.pem, turn the feature on in Cloudflare, then uncomment:
    # ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    include /etc/nginx/snippets/proxy.conf;
}
